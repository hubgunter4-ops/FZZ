[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fzz-security-tool"
version = "1.0.0"
description = "Herramienta de fuzzing HTTP y SAST para pruebas autorizadas"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.scripts]
fzz = "fzztool.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
