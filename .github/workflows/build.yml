name: Quality and platform builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q fzztool packaging

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.platform }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            output: fzz-linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
            output: fzz-windows-x86_64.exe
          - os: macos-13
            platform: macos-x86_64
            output: fzz-macos-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes binutils

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean --noconfirm fzz.spec

      - name: Rename executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv dist/fzz.exe "dist/${{ matrix.output }}"
          else
            mv dist/fzz "dist/${{ matrix.output }}"
            chmod +x "dist/${{ matrix.output }}"
          fi

      - name: Smoke test executable
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./dist/${{ matrix.output }} --version
            ./dist/${{ matrix.output }} --help > /dev/null
          else
            ./dist/${{ matrix.output }} --version
            ./dist/${{ matrix.output }} --help > /dev/null
          fi

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fzz-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum fzz-* > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
